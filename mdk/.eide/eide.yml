targets:
  f407:
    cppPreprocessAttrs:
      defineList:
        - STM32F40_41xxx
        - USE_STDPERIPH_DRIVER
        - HSE_VALUE=8000000
      incList:
        - .cmsis/include
        - RTE/_f407
